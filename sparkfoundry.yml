# Keep lecture IDs stable. Increase course.version when changing a published package.
schema: sparkfoundry-coursepack-v2
course:
  code: ad698-applied-generative-ai
  version: 2026.10.25-zip1
  title: AD698 — Applied Generative AI for Business Analytics
  description: Study language models, transformers, prompting, retrieval-augmented
    generation and agentic AI through lecture notes, presentations and labs.
  runtime_instructions: Complete each lab in the environment specified by its handout.
    Follow its setup, API-key, model and submission instructions.
  skills:
  - Language models
  - Transformers
  - Prompting
  - RAG
  - Agentic AI
exclude:
- M0/**
- M7/**
- M8/**
- '**/.env'
- data/**
- deliverables-solutions/**
- delivarables-solutions/**
